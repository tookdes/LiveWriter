[package]
name = "open-live-writer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Open Live Writer's Rust + GPUI Markdown editor"
build = "build.rs"

[dependencies]
anyhow = "1"
encoding_rs = "0.8"
futures = "0.3"
gpui = "0.2.2"
gpui-component = "0.4.0"
markdown = "1"
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["blocking", "charset", "http2", "rustls-tls-native-roots"] }
rust-embed = "8.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3.0"
