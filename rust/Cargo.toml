[package]
name = "open-live-writer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Open Live Writer's Rust + GPUI Markdown editor"
build = "build.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
gpui = "0.2.2"
gpui-component = "0.4.0"
rust-embed = "8.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

[build-dependencies]
embed-resource = "3.0"
