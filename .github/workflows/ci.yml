name: Rust + GPUI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build Rust editor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release editor
        run: cargo build --release

      - name: Upload release editor
        uses: actions/upload-artifact@v4
        with:
          name: open-live-writer-${{ matrix.os }}
          path: target/release/open-live-writer*
